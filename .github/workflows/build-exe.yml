name: Build Windows EXE

on:
  workflow_dispatch:       # 允许在 Actions 页面手动点 Run workflow
  push:
    tags:
      - "v*"              # 打 tag（如 v1.0.0）时自动构建并发布到 Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ExcelConverter desktop.py

      - name: Upload artifact (手动运行时下载)
        uses: actions/upload-artifact@v4
        with:
          name: ExcelConverter
          path: dist/ExcelConverter.exe
          if-no-files-found: error

      - name: Upload to Release (打 tag 时发布)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ExcelConverter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
